<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>WHY · 个人空间</title>
  <meta name="description" content="WHY 的个人主页：文章、音乐、工作与私信（留言簿）。冷色调简洁设计，适配 GitHub Pages。">
  <meta property="og:title" content="WHY · 个人空间">
  <meta property="og:description" content="栖身于冷冽与理性之间，探索交互的边界。文章、音乐与留言簿。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <!-- Inline SVG favicon -->
  <link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="%230f172a"/><circle cx="50" cy="36" r="18" fill="%23475569"/><ellipse cx="50" cy="74" rx="30" ry="16" fill="%23475569"/></svg>' type="image/svg+xml">

  <style>
    :root{--bg:#0f172a;--card:rgba(30,41,59,0.7);--muted:#94a3b8;--text:#e2e8f0;--accent:#94a3b8;--border:rgba(148,163,184,0.15)}
    [data-theme="light"]{--bg:#f8fafc;--card:rgba(255,255,255,0.85);--muted:#475569;--text:#0f172a;--accent:#475569;--border:rgba(71,85,105,0.08)}
    *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
    body{--mouse-x:50%;--mouse-y:50%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;padding:0 1.25rem;position:relative;overflow-x:hidden;cursor:none}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.42;background:radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(148,163,184,0.16), transparent 30%)}
    #customCursor{position:fixed;top:0;left:0;width:16px;height:16px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(1);background:rgba(148,163,184,0.85);box-shadow:0 0 0 4px rgba(148,163,184,0.18);transition:transform .15s ease,background .15s ease,opacity .18s ease;z-index:9999;opacity:0}
    body.mouse-active #customCursor{opacity:1}
    .wrapper{max-width:1100px;margin:0 auto;flex:1;display:flex;flex-direction:column}
    .navbar{display:flex;justify-content:flex-end;align-items:center;padding:1.8rem 0 1.2rem;border-bottom:1px solid var(--border);gap:1rem}
    .avatar-link{display:flex;align-items:center;justify-content:center;margin-right:auto}
    .avatar-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #475569;background:#1e293b;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer}
    .nav-menu{display:flex;align-items:center;gap:1.2rem}
    .nav-item{color:var(--muted);text-decoration:none;font-size:1rem;font-weight:500;padding:.3rem .4rem;border-radius:6px;transition:color .15s,background .15s,transform .2s}
    .nav-item:hover,.nav-item:focus{color:var(--text);outline:none;background:rgba(255,255,255,0.02);transform:translateY(-1px)}
    .home-link-active{color:var(--text);font-weight:600}
    .info-card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(71,85,105,0.2);border-radius:1.2rem;padding:2rem;box-shadow:0 18px 30px -8px rgba(0,0,0,.45);max-width:680px;transition:transform .25s ease,box-shadow .25s ease}
    .info-card:hover{transform:translateY(-3px);box-shadow:0 24px 36px rgba(0,0,0,.18)}
    .greeting{font-size:.95rem;color:var(--muted);margin-bottom:.6rem}
    .name{font-size:2.4rem;margin-bottom:.4rem;color:var(--text)}
    .title-badge{display:inline-block;background:#1e293b;color:#b9c7dd;padding:.25rem .8rem;border-radius:999px;font-size:.9rem;margin:0.4rem 0 1rem}
    .bio{font-size:1.05rem;color:var(--muted);margin:1rem 0 1.2rem;border-left:3px solid #475569;padding-left:1rem}
    .details-grid{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:1rem;border-top:1px solid rgba(148,163,184,0.12);padding-top:1rem}
    .detail-item{display:flex;flex-direction:column}
    .detail-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .detail-value{font-size:1rem;color:var(--text)}
    .social-links{margin-top:1.2rem;display:flex;gap:1rem}
    .social-icon{color:var(--muted);text-decoration:none;font-size:.95rem}
    .social-icon:hover{color:var(--text)}
    .placeholder-content{background:var(--card);backdrop-filter:blur(6px);border-radius:1rem;padding:2rem;color:var(--muted);border:1px solid rgba(51,65,85,0.08);max-width:680px;transition:transform .28s ease,box-shadow .28s ease,background .28s ease}
    .hidden-section{display:none}
    .visible-section{opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease}
    .visible-section.show-active{opacity:1;transform:translateY(0)}
    .tag-list{display:flex;gap:.6rem}
    .tag{background:#1e293b;padding:.35rem .8rem;border-radius:999px}
    .footer-note{text-align:right;font-size:.85rem;color:var(--muted);padding:2rem 0;border-top:1px solid rgba(71,85,105,0.08);margin-top:2rem}
    .messages-list{list-style:none;margin-top:1rem;display:flex;flex-direction:column;gap:.8rem;max-width:680px}
    .music-form{display:flex;flex-direction:column;gap:.6rem;max-width:680px;margin-top:1rem}
    .music-list{display:flex;flex-direction:column;gap:.9rem;margin-top:1.2rem}
    .music-card{background:rgba(255,255,255,0.04);padding:1rem;border-radius:.9rem;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:.6rem}
    .music-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem;font-size:.95rem;color:var(--muted)}
    .music-title{font-weight:600;color:var(--text)}
    .music-note{color:var(--text);line-height:1.6}
    .music-comments{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:.8rem}
    .music-comment-item{background:rgba(255,255,255,0.03);padding:.75rem;border-radius:.75rem;border:1px solid rgba(255,255,255,0.05);transition:transform .2s,box-shadow .2s}
    .music-comment-meta{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:.4rem}
    .music-comment-form{display:flex;flex-direction:column;gap:.55rem}
    .music-comment-input{min-height:80px;transition:border-color .25s,box-shadow .25s}
    .music-intro{margin-top:0.8rem;color:var(--muted)}
    .message-card{background:rgba(255,255,255,0.02);padding:1rem;border-radius:.8rem;border:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
    .message-card:hover,.music-comment-item:hover,.placeholder-content:hover{transform:translateY(-3px);box-shadow:0 18px 32px rgba(0,0,0,.12)}
    .message-meta{font-size:.85rem;color:var(--muted);margin-bottom:.4rem;display:flex;justify-content:space-between}
    .muted{color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    form{display:flex;flex-direction:column;gap:.6rem;max-width:680px}
    label{font-size:.9rem;color:var(--muted)}
    input,textarea{padding:.6rem .8rem;border-radius:.6rem;border:1px solid rgba(71,85,105,0.12);background:transparent;color:var(--text);resize:vertical;transition:border-color .22s,box-shadow .22s,transform .22s}
    input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(148,163,184,0.12);outline:none;transform:translateY(-1px)}
    .form-actions{display:flex;gap:.6rem;margin-top:.4rem}
    button{padding:.55rem .9rem;border-radius:.6rem;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
    button:hover{transform:translateY(-2px);background:rgba(255,255,255,0.06);box-shadow:0 10px 20px rgba(0,0,0,.14)}
    @media (max-width:600px){.avatar-img{width:40px;height:40px}.nav-menu{gap:.6rem}.info-card{padding:1.4rem}}
    /* language selector */
    .lang-wrap{display:flex;align-items:center;margin-left:1rem}
    .lang-select{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,0.04);padding:.35rem .5rem;border-radius:.45rem;font-size:.92rem}
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="navbar" role="banner">
      <a href="#" class="avatar-link" id="homeAvatarLink" title="回到主页">
        <!-- Inline SVG avatar -->
        <svg class="avatar-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="用户头像">
          <rect width="100" height="100" rx="50" fill="#0f172a" />
          <circle cx="50" cy="36" r="18" fill="#475569" />
          <ellipse cx="50" cy="74" rx="30" ry="16" fill="#475569" />
        </svg>
      </a>

      <nav class="nav-menu" id="mainMenu" role="navigation" aria-label="主导航">
        <a href="#" class="nav-item" data-section="home">主页</a>
        <a href="#" class="nav-item" data-section="articles">文章分享</a>
        <a href="#" class="nav-item" data-section="music">音乐推荐</a>
        <a href="#" class="nav-item" data-section="work">工作相关</a>
        <a href="#" class="nav-item message-link" data-section="messages">私信</a>
        <button id="themeToggle" class="nav-item" aria-pressed="false" title="切换深色/浅色主题">主题</button>
      </nav>
      <div class="lang-wrap">
        <label for="langSelect" class="sr-only">语言</label>
        <select id="langSelect" class="lang-select" aria-label="选择语言">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </header>

    <main id="contentArea">
      <section id="homeSection" class="home-section visible-section" aria-labelledby="homeTitle">
        <div class="info-card">
          <div class="greeting">✦ 个人主页</div>
          <h1 id="homeTitle" class="name">WHY</h1>
          <span class="title-badge">玩家</span>
          <p class="bio">栖身于冷冽与理性之间，探索交互的边界。</p>

          <div class="details-grid">
            <div class="detail-item">
              <span class="detail-label">所在地</span>
              <span class="detail-value location">湖北</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">联系</span>
              <span class="detail-value contact">0405why@gmail.com</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">状态</span>
              <span class="detail-value">在线</span>
            </div>
          </div>

          <div class="social-links" aria-label="社交链接">
            <a class="social-icon" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
            <a class="social-icon" href="https://dribbble.com/" target="_blank" rel="noopener">Dribbble</a>
            <a class="social-icon" href="https://t.me/" target="_blank" rel="noopener">Telegram</a>
          </div>
        </div>
      </section>

      <section id="articlesSection" class="placeholder-content hidden-section visible-section" aria-hidden="true">
        <h2>📄 文章分享</h2>
        <p class="muted">更多文章即将更新...</p>
      </section>

      <section id="musicSection" class="placeholder-content hidden-section visible-section" aria-hidden="true">
        <h2>🎵 音乐推荐</h2>
        <p class="muted music-intro">发布你喜欢的歌曲 / 艺人，并在下方讨论交流。</p>
        <form id="musicForm" class="music-form" aria-label="音乐推荐表单">
          <label for="musicTitle">曲目</label>
          <input id="musicTitle" name="title" type="text" placeholder="歌曲名称" required>

          <label for="musicArtist">艺人</label>
          <input id="musicArtist" name="artist" type="text" placeholder="歌手或乐队" required>

          <label for="musicUrl">链接（可选）</label>
          <input id="musicUrl" name="url" type="url" placeholder="音乐链接，例如 Spotify、YouTube">

          <label for="musicNote">推荐理由 / 说明</label>
          <textarea id="musicNote" name="note" rows="3" placeholder="为什么想推荐这首歌？"></textarea>

          <div class="form-actions">
            <button type="submit" id="submitMusic">发布推荐</button>
          </div>
        </form>

        <div id="musicList" class="music-list"></div>
      </section>

      <section id="workSection" class="placeholder-content hidden-section visible-section" aria-hidden="true">
        <h2>💼 工作相关</h2>
        <p class="muted">项目与经验将在此处展示。</p>
      </section>

      <section id="messagesSection" class="placeholder-content hidden-section visible-section" aria-hidden="true">
        <h2>✉️ 私信 / 留言簿</h2>
        <form id="messageForm" aria-label="留言表单">
          <label for="guestName">姓名</label>
          <input id="guestName" name="name" type="text" placeholder="你的名字" required>

          <label for="guestMessage">留言</label>
          <textarea id="guestMessage" name="message" rows="4" placeholder="写点什么吧…" required></textarea>

          <div class="form-actions">
            <button type="submit" id="submitMessage">发送</button>
            <button type="button" id="clearMessages">清空留言</button>
          </div>
        </form>

        <div id="messagesLive" role="status" aria-live="polite" class="muted sr-only"></div>

        <ul id="messagesList" class="messages-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="footer-note" role="contentinfo">© WHY · 2026</footer>
  </div>

  <script>
  (function(){
    const sections=['home','articles','music','work','messages'];
    const menuLinks=document.querySelectorAll('.nav-item');
    const avatar=document.getElementById('homeAvatarLink');
    function hideAll(){sections.forEach(s=>{const el=document.getElementById(s+'Section');if(el){el.classList.add('hidden-section');el.setAttribute('aria-hidden','true')}})}
    function show(section){hideAll();const el=document.getElementById(section+'Section');if(el){el.classList.remove('hidden-section');el.classList.add('visible-section');requestAnimationFrame(()=>el.classList.add('show-active'));el.setAttribute('aria-hidden','false')}menuLinks.forEach(l=>l.classList.toggle('home-link-active',l.dataset.section===section))}
    function navigate(section,push=true){if(!sections.includes(section))section='home';show(section);if(push)history.pushState({section},'',section==='home'?'/':`#${section}`)}
    menuLinks.forEach(link=>{link.addEventListener('click',e=>{e.preventDefault();const sec=link.dataset.section||'home';navigate(sec)})});
    avatar.addEventListener('click',e=>{e.preventDefault();navigate('home')});
    window.addEventListener('popstate',e=>{const state=(e.state&&e.state.section)||location.hash.replace('#','')||'home';show(state)});
    const themeToggle=document.getElementById('themeToggle');const root=document.documentElement;const THEME_KEY='site-theme';
    function setTheme(t){if(t==='light')root.setAttribute('data-theme','light');else root.removeAttribute('data-theme');themeToggle.setAttribute('aria-pressed',String(t==='light'));localStorage.setItem(THEME_KEY,t)}
    themeToggle.addEventListener('click',()=>{const current=localStorage.getItem(THEME_KEY)==='light'?'light':'dark';setTheme(current==='light'?'dark':'light')});
    (function initTheme(){const saved=localStorage.getItem(THEME_KEY);if(saved)setTheme(saved);else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)setTheme('light');else setTheme('dark')})();

    const cursorEl = document.createElement('div');cursorEl.id='customCursor';document.body.appendChild(cursorEl);
    document.addEventListener('mousemove',e=>{const x=Math.round((e.clientX/window.innerWidth)*100);const y=Math.round((e.clientY/window.innerHeight)*100);document.body.style.setProperty('--mouse-x', x+'%');document.body.style.setProperty('--mouse-y', y+'%');cursorEl.style.left=`${e.clientX}px`;cursorEl.style.top=`${e.clientY}px`;document.body.classList.add('mouse-active')});
    document.addEventListener('mouseleave',()=>{document.body.style.setProperty('--mouse-x','50%');document.body.style.setProperty('--mouse-y','50%');document.body.classList.remove('mouse-active')});

      'ja': {
        nav: {home: 'ホーム', articles: '記事', music: '音楽', work: '仕事', messages: 'メッセージ'},
        theme: 'テーマ', greeting: '✦ 個人ページ', title: 'WHY', badge: 'プレイヤー', bio: '冷たさと理性の間に佇み、インタラクションの境界を探る。',
        labels: {location: '所在地', contact: '連絡', status: '状態'},
        articles_more: '記事を準備中...', music_intro: '好きな曲やアーティストを投稿して、下で交流しましょう。', work_placeholder: 'プロジェクトと経験がここに表示されます。',
        music_title_label: '曲名', music_artist_label: 'アーティスト', music_url_label: 'リンク（任意）', music_note_label: 'おすすめ理由 / 説明',
        music_title_placeholder: '曲名', music_artist_placeholder: '歌手またはバンド', music_url_placeholder: 'Spotify、YouTubeなどの音楽リンク', music_note_placeholder: 'おすすめしたい理由は？', music_submit: '投稿する', music_empty: 'まだおすすめはありません。ぜひ最初にシェアしてください！', music_empty_alert: '曲名とアーティストを入力してください', music_comment_placeholder: 'コメントを入力してください', music_comment_submit: 'コメントする', music_no_comments: 'まだ議論はありません。ぜひコメントしてください。', music_discussion_header: 'ディスカッション', music_comments_label: 'コメント', music_comment_empty_alert: 'コメントを入力してください',
        msg_heading: '✉️ メッセージ / ゲストブック', name_label: '名前', message_label: 'メッセージ', send: '送信', clear: 'クリア', no_messages: 'まだメッセージはありません。ぜひ最初の投稿を！',
        confirm_clear: '全てのメッセージを削除してもよろしいですか？', empty_message_alert: 'メッセージを入力してください', saved: 'メッセージを保存しました。', deleted: 'メッセージを削除しました。', cleared: 'メッセージを全て削除しました。'
      }
    };

    function detectLang(){
      const saved = localStorage.getItem(LANG_KEY);
      if(saved && i18n[saved]) return saved;
      const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if(nav.startsWith('zh-tw') || nav.startsWith('zh-hk') || nav.startsWith('zh-mo')) return 'zh-TW';
      if(nav.startsWith('zh')) return 'zh-CN';
      if(nav.startsWith('ja')) return 'ja';
      return 'en';
    }

    function applyLang(lang){
      const dict = i18n[lang] || i18n['en'];
      // nav items
      document.querySelectorAll('.nav-item').forEach(el=>{
        const sec = el.dataset.section;
        if(sec && dict.nav[sec]) el.textContent = dict.nav[sec];
      });
      // theme button
      const themeBtn = document.getElementById('themeToggle'); if(themeBtn) themeBtn.textContent = dict.theme;
      // greeting, name, badge, bio
      const greet = document.querySelector('.greeting'); if(greet) greet.textContent = dict.greeting;
      const nameEl = document.getElementById('homeTitle'); if(nameEl) nameEl.textContent = dict.title;
      const badge = document.querySelector('.title-badge'); if(badge) badge.textContent = dict.badge;
      const bio = document.querySelector('.bio'); if(bio) bio.textContent = dict.bio;
      // details labels
      const labels = document.querySelectorAll('.detail-item .detail-label');
      if(labels && labels.length>=3){ labels[0].textContent = dict.labels.location; labels[1].textContent = dict.labels.contact; labels[2].textContent = dict.labels.status; }
      // placeholders and section texts
      const articlesMuted = document.querySelector('#articlesSection .muted'); if(articlesMuted) articlesMuted.textContent = dict.articles_more;
      const musicIntro = document.querySelector('.music-intro'); if(musicIntro) musicIntro.textContent = dict.music_intro;
      const workMuted = document.querySelector('#workSection .muted'); if(workMuted) workMuted.textContent = dict.work_placeholder;
      // messages form labels/placeholders
      const msgHeading = document.querySelector('#messagesSection h2'); if(msgHeading) msgHeading.textContent = dict.msg_heading;
      const nameLabel = document.querySelector('label[for="guestName"]'); if(nameLabel) nameLabel.textContent = dict.name_label;
      const msgLabel = document.querySelector('label[for="guestMessage"]'); if(msgLabel) msgLabel.textContent = dict.message_label;
      const nameInputEl = document.getElementById('guestName'); if(nameInputEl) nameInputEl.placeholder = dict.name_label;
      const msgInputEl = document.getElementById('guestMessage'); if(msgInputEl) msgInputEl.placeholder = dict.message_label;
      const submitBtn = document.getElementById('submitMessage'); if(submitBtn) submitBtn.textContent = dict.send;
      const clearBtnEl = document.getElementById('clearMessages'); if(clearBtnEl) clearBtnEl.textContent = dict.clear;
      const musicTitleLabel = document.querySelector('label[for="musicTitle"]'); if(musicTitleLabel) musicTitleLabel.textContent = dict.music_title_label;
      const musicArtistLabel = document.querySelector('label[for="musicArtist"]'); if(musicArtistLabel) musicArtistLabel.textContent = dict.music_artist_label;
      const musicUrlLabel = document.querySelector('label[for="musicUrl"]'); if(musicUrlLabel) musicUrlLabel.textContent = dict.music_url_label;
      const musicNoteLabel = document.querySelector('label[for="musicNote"]'); if(musicNoteLabel) musicNoteLabel.textContent = dict.music_note_label;
      const musicTitleInput = document.getElementById('musicTitle'); if(musicTitleInput) musicTitleInput.placeholder = dict.music_title_placeholder;
      const musicArtistInput = document.getElementById('musicArtist'); if(musicArtistInput) musicArtistInput.placeholder = dict.music_artist_placeholder;
      const musicUrlInput = document.getElementById('musicUrl'); if(musicUrlInput) musicUrlInput.placeholder = dict.music_url_placeholder;
      const musicNoteInput = document.getElementById('musicNote'); if(musicNoteInput) musicNoteInput.placeholder = dict.music_note_placeholder;
      const musicSubmitBtn = document.getElementById('submitMusic'); if(musicSubmitBtn) musicSubmitBtn.textContent = dict.music_submit;
      // update messages list text if empty
      const msgs = loadMessages(); if(msgs.length===0){ const l = document.getElementById('messagesList'); if(l) l.innerHTML = `<li class="muted">${dict.no_messages}</li>` }
      // store and set select
      localStorage.setItem(LANG_KEY, lang);
      if(langSelect) langSelect.value = lang;
      // expose current translation for other functions
      window._T = dict;
    }

    if(langSelect){
      langSelect.addEventListener('change', (e)=>{ applyLang(e.target.value); renderMessages(); renderMusic(); });
    }
    // initialize language
    applyLang(detectLang());

    // --- end i18n ---

    const MKEY='guestbookMessages_v1';
    const MUSIC_KEY='musicRecommendations_v1';
    const form=document.getElementById('messageForm');
    const nameInput=document.getElementById('guestName');
    const messageInput=document.getElementById('guestMessage');
    const list=document.getElementById('messagesList');
    const live=document.getElementById('messagesLive');
    const clearBtn=document.getElementById('clearMessages');
    const musicForm=document.getElementById('musicForm');
    const musicTitle=document.getElementById('musicTitle');
    const musicArtist=document.getElementById('musicArtist');
    const musicUrl=document.getElementById('musicUrl');
    const musicNote=document.getElementById('musicNote');
    const musicListEl=document.getElementById('musicList');

    function loadMessages(){try{return JSON.parse(localStorage.getItem(MKEY)||'[]')}catch(e){return[]}}
    function saveMessages(arr){localStorage.setItem(MKEY,JSON.stringify(arr))}
    function renderMessages(){list.innerHTML='';const msgs=loadMessages().slice().reverse();if(msgs.length===0){const emptyText=(window._T && window._T.no_messages) || '暂无留言，快来发表第一个吧！';list.innerHTML=`<li class="muted">${emptyText}</li>`;return}msgs.forEach(m=>{const li=document.createElement('li');li.className='message-card';const meta=document.createElement('div');meta.className='message-meta';const who=document.createElement('span');who.textContent=`${m.name||((window._T && window._T.name_label) || '匿名')}`;const when=document.createElement('span');when.textContent=new Date(m.time).toLocaleString();meta.appendChild(who);meta.appendChild(when);const body=document.createElement('div');body.textContent=m.text;const remove=document.createElement('button');remove.textContent=(window._T && window._T.clear) ? (window._T.clear === 'Clear' ? 'Delete' : (window._T.clear === 'クリア' ? '削除' : '删除')) : '删除';remove.style.marginTop='.6rem';remove.addEventListener('click',()=>{deleteMessage(m.id)});li.appendChild(meta);li.appendChild(body);li.appendChild(remove);list.appendChild(li)})}
    function addMessage(name,text){const arr=loadMessages();const entry={id:Date.now(),name:name.trim()||((window._T && window._T.name_label) || '匿名'),text:text.trim(),time:Date.now()};arr.push(entry);saveMessages(arr);renderMessages();live.textContent=(window._T && window._T.saved) || '留言已保存。'}
    function deleteMessage(id){let arr=loadMessages();arr=arr.filter(x=>x.id!==id);saveMessages(arr);renderMessages();live.textContent=(window._T && window._T.deleted) || '留言已删除。'}
    function clearAll(){const conf=(window._T && window._T.confirm_clear) || '确定要删除所有留言吗？';if(confirm(conf)){localStorage.removeItem(MKEY);renderMessages();live.textContent=(window._T && window._T.cleared) || '已清空留言'}}

    function loadMusic(){try{return JSON.parse(localStorage.getItem(MUSIC_KEY)||'[]')}catch(e){return[]}}
    function saveMusic(arr){localStorage.setItem(MUSIC_KEY,JSON.stringify(arr))}
    function renderMusic(){if(!musicListEl)return;musicListEl.innerHTML='';const recs=loadMusic().slice().reverse();if(recs.length===0){const emptyText=(window._T && window._T.music_empty) || '暂无推荐，快来发布第一条音乐。';const emptyEl=document.createElement('div');emptyEl.className='muted';emptyEl.textContent=emptyText;musicListEl.appendChild(emptyEl);return}recs.forEach(item=>{const card=document.createElement('div');card.className='music-card';const top=document.createElement('div');top.className='music-meta';const track=document.createElement('span');track.className='music-title';track.textContent=item.title||((window._T && window._T.music_title_label) || '曲目');const artist=document.createElement('span');artist.textContent=item.artist||((window._T && window._T.music_artist_label) || '艺人');top.appendChild(track);top.appendChild(artist);const note=document.createElement('div');note.className='music-note';note.textContent=item.note || '';
      if(item.url){const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=(window._T && window._T.music_url_label) || '链接';link.style.display='inline-block';link.style.color='var(--accent)';link.style.textDecoration='none';link.style.marginTop='.35rem';note.appendChild(document.createElement('br'));note.appendChild(link)}
      const footer=document.createElement('div');footer.className='music-meta';footer.style.justifyContent='space-between';const time=document.createElement('span');time.textContent=new Date(item.time).toLocaleString();const remove=document.createElement('button');remove.textContent=(window._T && window._T.clear) ? (window._T.clear === 'Clear' ? 'Delete' : (window._T.clear === 'クリア' ? '削除' : '删除')) : '删除';remove.style.marginTop='.4rem';remove.addEventListener('click',()=>{deleteMusic(item.id)});footer.appendChild(time);footer.appendChild(remove);card.appendChild(top);card.appendChild(note);card.appendChild(footer);
      const commentsBlock=document.createElement('div');commentsBlock.className='music-comments';
      const commentsHeader=document.createElement('div');commentsHeader.className='music-meta';const commentsTitle=document.createElement('span');commentsTitle.textContent=(window._T && window._T.music_discussion_header) || 'Discussion';commentsHeader.appendChild(commentsTitle);const commentsCount=document.createElement('span');commentsCount.textContent=`${(item.comments||[]).length} ${(window._T && window._T.comments_label) || 'comments'}`;commentsHeader.appendChild(commentsCount);commentsBlock.appendChild(commentsHeader);
      const commentList=document.createElement('div');commentList.className='music-comment-list';const comments=(item.comments||[]).slice().reverse();if(comments.length===0){const emptyComments=document.createElement('div');emptyComments.className='muted';emptyComments.textContent=(window._T && window._T.music_no_comments) || '暂无讨论，欢迎留言。';commentList.appendChild(emptyComments);}else{comments.forEach(c=>{const commentItem=document.createElement('div');commentItem.className='music-comment-item';const meta=document.createElement('div');meta.className='music-comment-meta';const commentTime=document.createElement('span');commentTime.textContent=new Date(c.time).toLocaleString();meta.appendChild(commentTime);const commentBody=document.createElement('div');commentBody.textContent=c.text;commentItem.appendChild(meta);commentItem.appendChild(commentBody);commentList.appendChild(commentItem);})}
      commentsBlock.appendChild(commentList);
      const commentForm=document.createElement('form');commentForm.className='music-comment-form';commentForm.addEventListener('submit',e=>{e.preventDefault();const textarea=e.target.querySelector('textarea');const value=textarea.value;if(!value.trim()){alert((window._T && window._T.music_comment_empty_alert) || '请填写评论内容');return;}addMusicComment(item.id,value);textarea.value=''});
      const commentInput=document.createElement('textarea');commentInput.className='music-comment-input';commentInput.placeholder=(window._T && window._T.music_comment_placeholder) || '写下你的讨论或推荐理由';commentInput.rows=2;commentForm.appendChild(commentInput);
      const commentButton=document.createElement('button');commentButton.type='submit';commentButton.textContent=(window._T && window._T.music_comment_submit) || '发表评论';commentForm.appendChild(commentButton);
      commentsBlock.appendChild(commentForm);
      card.appendChild(commentsBlock);
      musicListEl.appendChild(card)})}
    function addMusic(title,artist,url,note){const arr=loadMusic();const entry={id:Date.now(),title:title.trim(),artist:artist.trim(),url:url.trim(),note:note.trim(),time:Date.now(),comments:[]};arr.push(entry);saveMusic(arr);renderMusic();}
    function deleteMusic(id){let arr=loadMusic();arr=arr.filter(x=>x.id!==id);saveMusic(arr);renderMusic();}
    function addMusicComment(trackId,text){const arr=loadMusic();const item=arr.find(x=>x.id===trackId);if(!item)return;item.comments=item.comments||[];item.comments.push({id:Date.now(),text:text.trim(),time:Date.now()});saveMusic(arr);renderMusic();}

    if(form){form.addEventListener('submit',e=>{e.preventDefault();const n=nameInput.value;const t=messageInput.value;if(!t.trim()){alert((window._T && window._T.empty_message_alert) || '请填写留言内容');return}addMessage(n,t);form.reset()})}
    if(clearBtn)clearBtn.addEventListener('click',clearAll);
    if(musicForm){musicForm.addEventListener('submit',e=>{e.preventDefault();const title=musicTitle.value;const artist=musicArtist.value;const url=musicUrl.value;const note=musicNote.value;if(!title.trim()||!artist.trim()){alert((window._T && window._T.music_empty_alert) || '请填写曲目和艺人');return}addMusic(title,artist,url,note);musicForm.reset()})}
    renderMessages();renderMusic();const initial=location.hash.replace('#','')||'home';navigate(initial,false);
  })();
  </script>
</body>
</html>
